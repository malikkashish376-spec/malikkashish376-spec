              COMMIT_DATE=$(date -u -d "$day days ago 12:00:00" +"%Y-%m-%dT%H:%M:%SZ")
              COUNT=$(( ( RANDOM % 5 ) + 3 ))
              for c in $(seq 1 $COUNT); do
                GIT_AUTHOR_DATE="$COMMIT_DATE" GIT_COMMITTER_DATE="$COMMIT_DATE" \
                  git commit --allow-empty -m "chore: activity sync" --quiet
              done
